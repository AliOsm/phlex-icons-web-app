service: phlex-icons

# Published to GitHub's registry by the Deploy workflow, which signs in with
# the job's GITHUB_TOKEN.
image: aliosm/phlex-icons

registry:
  server: ghcr.io
  username: AliOsm

  password:
    - KAMAL_REGISTRY_PASSWORD

# ieasy-books-vm, a GCP VM shared with baheth and makhzan. Kamal reaches its
# SSH port through an IAP tunnel, so deploys need a gcloud login that may open
# one (the Deploy workflow signs in as kamal-deploy) and ubuntu's key.
servers:
  web:
    hosts:
      - ieasy-books-vm

ssh:
  user: ubuntu
  proxy_command: gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone europe-west1-b --project earnest-reactor-514916-n4

# phlex-icons-gcp.ieasybooks.com is a test hostname for the move to GCP.
proxy:
  hosts:
    - phlex-icons.fun
    - phlex-icons-gcp.ieasybooks.com
  ssl: true
  healthcheck:
    path: /up

env:
  secret:
    - RAILS_MASTER_KEY

asset_path: /rails/public/assets

# The VM is ARM, and so is the Deploy workflow's runner, so the image is built
# there.
builder:
  arch: arm64
